apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-repair-shop-api
  namespace: auto-repair-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auto-repair-shop-api
  template:
    metadata:
      labels:
        app: auto-repair-shop-api
    spec:
      containers:
        - name: api
          image: auto-repair-shop-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /docs
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: auto-repair-shop
spec:
  selector:
    app: auto-repair-shop-api
  ports:
    - port: 80
      targetPort: 3000
  type: LoadBalancer
