apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-repair-shop-api
  namespace: auto-repair-shop
  labels:
    app: auto-repair-shop-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auto-repair-shop-api
  template:
    metadata:
      labels:
        app: auto-repair-shop-api
    spec:
      containers:
        - name: api
          image: ${ECR_REPOSITORY_URL}:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auto-repair-shop-api
  namespace: auto-repair-shop
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: auto-repair-shop-api
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
