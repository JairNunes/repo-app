# Alerta 1 — Falha em Ordem de Serviço
# Critério: pelo menos 1 evento ServiceOrderError em janela de 5 minutos
# Severidade: Critical
# Notificação: email + Slack (opcional)

name: "Oficina Mecânica — Falha em OS"
type: NRQL
nrql: |
  SELECT count(*) FROM ServiceOrderError SINCE 5 minutes ago
condition:
  threshold: 0
  operator: above
  threshold_duration: 300
  threshold_occurrences: at_least_once
severity: CRITICAL
runbook_url: https://github.com/JairNunes/repo-app/blob/main/docs/observability/runbook-falha-os.md
description: >
  Evento ServiceOrderError foi registrado, indicando que uma operação de OS
  falhou (criação, transição de status, ou notificação). Investigar log com
  o `correlationId` do evento para reproduzir o cenário.
