# Alerta 2 — Latência alta (p95 > 2s)
# Critério: p95 do response time superior a 2000ms por 5 minutos consecutivos
# Severidade: Warning

name: "Oficina Mecânica — Latência alta (p95 > 2s)"
type: NRQL
nrql: |
  SELECT percentile(duration, 95) FROM Transaction
  WHERE appName = 'oficina-mecanica-api'
condition:
  threshold: 2.0
  operator: above
  threshold_duration: 300
  threshold_occurrences: all
severity: WARNING
description: >
  Latência p95 acima de 2s indica que a aplicação está respondendo lentamente.
  Possíveis causas: queries lentas no RDS, lock no PostgreSQL, HPA não escalou,
  cold start de Lambda dependente, throttling do New Relic. Investigar via
  Distributed Tracing.
