name: ci-cd

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: oficina-mecanica-eks-app
  EKS_CLUSTER: oficina-mecanica-eks
  K8S_NAMESPACE: auto-repair-shop
  NODE_VERSION: "20"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auto_repair_shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auto_repair_shop_test?schema=public
      - run: npm run lint
      - run: npm run test -- --coverage --passWithNoTests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auto_repair_shop_test?schema=public
          JWT_SECRET: test-secret-key-32-chars-long-xx
          JWT_EXPIRES_IN: 24h
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 5

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      image-uri: ${{ steps.meta.outputs.image-uri }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - id: meta
        run: |
          TAG="${{ github.sha }}"
          URI="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          echo "image-tag=$TAG" >> $GITHUB_OUTPUT
          echo "image-uri=$URI" >> $GITHUB_OUTPUT
      - run: |
          docker build -t ${{ steps.meta.outputs.image-uri }}:${{ steps.meta.outputs.image-tag }} \
                       -t ${{ steps.meta.outputs.image-uri }}:latest .
          docker push ${{ steps.meta.outputs.image-uri }}:${{ steps.meta.outputs.image-tag }}
          docker push ${{ steps.meta.outputs.image-uri }}:latest

  deploy-eks:
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - env:
          ECR_REPOSITORY_URL: ${{ needs.docker-build-and-push.outputs.image-uri }}
          IMAGE_TAG: ${{ needs.docker-build-and-push.outputs.image-tag }}
        run: |
          mkdir -p k8s-rendered
          for f in k8s/*.yaml; do
            envsubst < "$f" > "k8s-rendered/$(basename $f)"
          done

      # secret.yaml vem do repo-infra-k8s
      - run: |
          kubectl apply -f k8s-rendered/namespace.yaml
          kubectl apply -f k8s-rendered/configmap.yaml
          kubectl apply -f k8s-rendered/app-deployment.yaml
          kubectl apply -f k8s-rendered/hpa.yaml

      - run: kubectl rollout status deployment/auto-repair-shop-api -n ${{ env.K8S_NAMESPACE }} --timeout=180s

      - env:
          NR_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NR_APP_ID: ${{ secrets.NEW_RELIC_APP_ID }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -n "$NR_API_KEY" ] && [ -n "$NR_APP_ID" ]; then
            curl -X POST "https://api.newrelic.com/v2/applications/${NR_APP_ID}/deployments.json" \
              -H "X-Api-Key: ${NR_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"deployment\":{\"revision\":\"${SHA}\",\"changelog\":\"${MSG}\",\"description\":\"Deploy via GitHub Actions\",\"user\":\"${ACTOR}\"}}"
          fi
